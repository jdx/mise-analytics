name: brew

on:
  schedule:
    - cron: '0 8 * * *'
    # Catch-up run: a failed morning run (for example a rejected push) cannot be
    # recollected tomorrow, so try again. It skips itself when today is saved.
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: brew
  cancel-in-progress: false

jobs:
  brew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A queued push-triggered run would otherwise check out the older
          # commit that triggered it, not the current tip of main.
          ref: main
          fetch-depth: 0

      - name: Skip the catch-up run when today is already collected
        id: collected
        if: github.event_name == 'schedule' && github.event.schedule == '0 20 * * *'
        run: |
          today=$(date -u +%F)
          if grep -q "^$today," mise.csv && grep -q "^$today," top-repos-downloads.csv; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: jdx/mise-action@v2
        if: steps.collected.outputs.skip != 'true'

      - name: Fetch Homebrew Analytics and GitHub Stars
        if: steps.collected.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One transient HTTP failure used to fail the whole run, and a missed
          # day cannot be recollected later (Homebrew only serves the current
          # 30-day window). Retry each fetch task as a whole: curl's own retry
          # can replay a response into a pipe and duplicate or corrupt it.
          for task in fetch-stats fetch-competitors fetch-hk-competitors \
            fetch-aube-competitors fetch-fnox-competitors fetch-top-repos \
            fetch-top-repos-downloads; do
            for attempt in 1 2 3 4 5; do
              mise run "$task" && continue 2
              echo "::warning::$task failed (attempt $attempt)"
              [ "$attempt" -lt 5 ] && sleep $((attempt * 30))
            done
            exit 1
          done

      - name: Generate plots
        if: steps.collected.outputs.skip != 'true'
        run: |
          mise run plot-stats
          mise run plot-hk-stats
          mise run plot-fnox-stats
          mise run plot-aube-stats
          mise run plot-top-repos
          mise run plot-top-repos-downloads
          mise run plot-brew-rankings
          mise run plot-mise-brew-rank
          mise run generate-fastest-growing

      - name: Commit changes
        if: steps.collected.outputs.skip != 'true'
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add *.csv *.txt charts/*.png README.md
          git diff --cached
          COMMIT_MSG=$(uv run python mise-tasks/generate-commit-message.py)
          git commit -m "$COMMIT_MSG" || exit 0
          # A push to main during the run makes a plain push non-fast-forward,
          # which would drop that day's download snapshot. Rebase and retry.
          # Never auto-resolve conflicts: the CSVs hold saved measurements, so a
          # conflicting backfill must fail the run instead of being dropped.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push attempt $attempt failed; rebasing and retrying"
            # A failed fetch or rebase must not stop the loop (the step runs
            # with set -e), so tolerate it and clean up any half-done rebase.
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 5))
          done
          # Every push failed and the runner is about to be discarded. Print
          # the day's CSV rows so they can be re-added by hand.
          echo "::error::git push failed after 5 attempts; the rows below were not saved"
          echo "::group::Unsaved CSV rows ($(date -u +%F))"
          git show --format= --unified=0 HEAD -- '*.csv'
          echo "::endgroup::"
          exit 1

permissions:
  contents: write
