name: brew

on:
  schedule:
    - cron: '0 8 * * *' 
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: brew
  cancel-in-progress: false

jobs:
  brew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A queued push-triggered run would otherwise check out the older
          # commit that triggered it, not the current tip of main.
          ref: main
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Fetch Homebrew Analytics and GitHub Stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise run fetch-stats
          mise run fetch-competitors
          mise run fetch-hk-competitors
          mise run fetch-aube-competitors
          mise run fetch-fnox-competitors
          mise run fetch-top-repos
          mise run fetch-top-repos-downloads

      - name: Generate plots
        run: |
          mise run plot-stats
          mise run plot-hk-stats
          mise run plot-fnox-stats
          mise run plot-aube-stats
          mise run plot-top-repos
          mise run plot-top-repos-downloads
          mise run plot-brew-rankings
          mise run plot-mise-brew-rank
          mise run generate-fastest-growing

      - name: Commit changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add *.csv *.txt charts/*.png README.md
          git diff --cached
          COMMIT_MSG=$(uv run python mise-tasks/generate-commit-message.py)
          git commit -m "$COMMIT_MSG" || exit 0
          # A push to main during the run makes a plain push non-fast-forward,
          # which would drop that day's download snapshot. Rebase and retry.
          # Never auto-resolve conflicts: the CSVs hold saved measurements, so a
          # conflicting backfill must fail the run instead of being dropped.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push attempt $attempt failed; rebasing and retrying"
            # A failed fetch or rebase must not stop the loop (the step runs
            # with set -e), so tolerate it and clean up any half-done rebase.
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 5))
          done
          exit 1

permissions:
  contents: write
